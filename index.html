<!DOCTYPE html>
<html>
<head>
  <title>Patch v1.1</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #00ff9d;
      font-family: Consolas, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .terminal {
      background: #161616;
      padding: 30px;
      border-radius: 8px;
      width: 420px;
      box-shadow: 0 0 20px rgba(0,255,157,0.2);
    }

    .line {
      margin: 8px 0;
    }

    .btn {
      margin-top: 20px;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid #00ff9d;
      color: #00ff9d;
      cursor: pointer;
      font-family: Consolas, monospace;
    }

    .btn:hover {
      background: #00ff9d;
      color: #0f0f0f;
    }

    #no {
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="line">> initializing apology_protocol...</div>
    <div class="line">> detecting issue: unnecessary_teasing</div>
    <div class="line">> impact_level: high</div>
    <div class="line">> priority: Aarvee</div>
    <div class="line">> status: genuinely_sorry</div>
    <div class="line">> request: restore_bestfriend_mode?</div>

    <button class="btn" onclick="alert('Patch applied successfully. Thank you 🙂')">
      Accept Patch
    </button>

    <button class="btn" id="no">Reject Patch</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", function() {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 40);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>

</body>
</html>
