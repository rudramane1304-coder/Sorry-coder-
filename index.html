<!DOCTYPE html>
<html>
<head>
  <title>Sorry Sunaina jii🎀!!!</title>
  <style>
    body {
      background: #ffe6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Comic Sans MS, cursive;
      text-align: center;
      overflow: hidden;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      position: relative;
    }
    h1 { color: #ff4d88; }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 10px;
      position: relative;
    }

    #yes {
      background: #ff4d88;
      color: white;
    }

    #no {
      background: #999;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Hey Sunaina!!!</h1>
    <p>
      Aapko hurt nhi karna tha,<br><br>
      but i did it bimistakely!<br><br>
      Ye bass isiliye taki u know ki you are special to me<br><br>
      aur nhi likhta warna AWKWARD hojaega🤭. Im sorry🫠
    </p>

    <button id="yes" onclick="alert('YAYYY 🥳 Bestfriend restored successfully ❤️')">
      Forgive 😌
    </button>

    <button id="no">Still Angry 😤</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", function() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>
</body>
</html>
